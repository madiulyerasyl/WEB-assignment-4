<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 0 - Contact Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">Yerasyl</div>

        <nav>
            <a href="index.html">Task 0</a>
            <a href="task1/index.html">Task 1</a>
            <a href="task2/index.html">Task 2</a>
            <a href="task3/index.html">Task 3</a>
            <a href="task4/index.html">Task 4</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h1>Contact Us</h1>
            <p>Send us a message using the form below.</p>

            <form action="#" method="get">

                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <button type="submit">Submit</button>

            </form>
        </div>
    </main>

</body>
</html>
