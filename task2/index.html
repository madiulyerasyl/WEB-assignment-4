<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Bootstrap Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="navbar navbar-dark bg-dark px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Yerasyl</a>

            <nav class="d-flex gap-4">
                <a href="../index.html">Task 0</a>
                <a href="../task1/index.html">Task 1</a>
                <a href="index.html">Task 2</a>
                <a href="../task3/index.html">Task 3</a>
                <a href="../task4/index.html">Task 4</a>
            </nav>
        </div>
    </header>

    <main class="container my-5">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm p-4">

                    <h1 class="text-center mb-3">Contact Us</h1>
                    <p class="text-center text-muted">
                        Send us a message using Bootstrap form.
                    </p>

                    <form action="#" method="get">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control"
                                       id="name" name="name"
                                       placeholder="Enter your name">
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control"
                                       id="email" name="email"
                                       placeholder="example@gmail.com">
                                <div class="form-text">
                                    We will not share your email.
                                </div>
                            </div>

                            <div class="col-12">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control"
                                          id="message" name="message"
                                          rows="5"
                                          placeholder="Write your message"></textarea>
                            </div>

                            <div class="col-12">
                                <button type="submit" class="btn btn-dark w-100">
                                    Submit
                                </button>
                            </div>

                        </div>

                    </form>

                </div>

            </div>
        </div>

    </main>

</body>
</html>
