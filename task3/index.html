<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Bootstrap Validation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="navbar navbar-dark bg-dark px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Yerasyl</a>

            <nav class="d-flex gap-4">
                <a href="../index.html">Task 0</a>
                <a href="../task1/index.html">Task 1</a>
                <a href="../task2/index.html">Task 2</a>
                <a href="index.html">Task 3</a>
                <a href="../task4/index.html">Task 4</a>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm p-4">
                    <h1 class="text-center mb-3">Contact Validation</h1>
                    <p class="text-center text-muted">
                        Enter your information and check validation.
                    </p>

                    <form id="contactForm" novalidate>

                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control"
                                   id="name" required minlength="2">

                            <div class="valid-feedback">Looks good!</div>
                            <div class="invalid-feedback">
                                Please enter at least 2 characters.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control"
                                   id="email" required>

                            <div class="valid-feedback">Looks good!</div>
                            <div class="invalid-feedback">
                                Please enter a valid email address.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control"
                                      id="message" rows="5"
                                      required minlength="10"></textarea>

                            <div class="valid-feedback">Looks good!</div>
                            <div class="invalid-feedback">
                                Please enter at least 10 characters.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100">
                            Submit
                        </button>

                        <p id="successMessage" class="text-success mt-3"></p>

                    </form>
                </div>

            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById("contactForm");
        const fields = form.querySelectorAll("input, textarea");
        const successMessage = document.getElementById("successMessage");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            let allValid = true;
            successMessage.textContent = "";

            fields.forEach(function(field) {
                field.classList.remove("is-valid", "is-invalid");

                if (field.checkValidity()) {
                    field.classList.add("is-valid");
                } else {
                    field.classList.add("is-invalid");
                    allValid = false;
                }
            });

            if (allValid) {
                successMessage.textContent =
                    "Your form has been validated successfully!";
            }
        });
    </script>

</body>
</html>
